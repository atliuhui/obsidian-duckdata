name: Release

on:
  push:
    tags:
      # Pure semver, optionally with pre-release/build suffix (e.g. 0.2.0-test).
      # Obsidian rejects v-prefixed tags, so don't add `v`.
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest version
        # `0.2.0` and `0.2.0-test` should both validate against manifest 0.2.0.
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="${TAG%%-*}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$BASE" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag base $BASE does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Verify build outputs
        shell: bash
        run: |
          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    # Skip publishing for *-test / *-debug tags (dry runs).
    if: ${{ !contains(github.ref_name, '-test') && !contains(github.ref_name, '-debug') }}
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum main.js manifest.json styles.css > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        # Pinned to v3.0.0 commit SHA for supply-chain safety.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release-artifacts/main.js
            release-artifacts/manifest.json
            release-artifacts/styles.css
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
